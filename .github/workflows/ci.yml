name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -X utf8 -m unittest discover tests -v
      - name: Corpus validation
        run: python -X utf8 tools/validate_corpus.py
      - name: Hub dry-run check
        run: PHONEBOX_DATA_DIR=$(pwd)/data python -X utf8 scripts/daily_hub.py --check
